
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F1E6">
  <title>Thank You | Vodou Official</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F4F1E6;
      --paper-alt: #DFD9C3;
      --ink: #141412;
      --ink-soft: #383732;
      --green: #128A43;
      --green-deep: #0b5f2f;
      --white: #fff;
      --display: 'Bevan', serif;
      --body: 'Work Sans', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 6%;
      border-bottom: 2px solid var(--ink);
      display: flex;
      justify-content: center;
    }

    .brand {
      font-family: var(--display);
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: 1px;
      color: var(--ink);
      text-decoration: none;
    }

    main {
      width: min(760px, 92%);
      margin: auto;
      padding: 65px 0;
      text-align: center;
    }

    .symbol {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border: 3px solid var(--green);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green);
      font-size: 42px;
      font-weight: 800;
    }

    .eyebrow {
      color: var(--green-deep);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
      margin: 15px 0;
    }

    #message {
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.7;
      max-width: 570px;
      margin: 0 auto 28px;
    }

    .order-card {
      display: none;
      text-align: left;
      background: var(--white);
      border: 2px solid var(--ink);
      padding: 25px;
      margin: 30px auto;
      max-width: 540px;
    }

    .order-card h2 {
      font-family: var(--display);
      font-size: 21px;
      margin: 0 0 18px;
    }

    .item-row, .total-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid var(--paper-alt);
      font-size: 14px;
    }

    .total-row {
      border: 0;
      border-top: 2px solid var(--ink);
      margin-top: 10px;
      padding-top: 16px;
      font-size: 18px;
      font-weight: 800;
    }

    .status-note {
      background: var(--paper-alt);
      padding: 14px;
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 15px 23px;
      background: var(--green);
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      border: 2px solid var(--green);
      cursor: pointer;
      font-family: var(--body);
    }

    .button:hover { background: var(--green-deep); }

    .button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--ink);
    }

    .button.secondary:hover {
      background: var(--ink);
      color: var(--white);
    }

    .button:disabled {
      opacity: .5;
      cursor: wait;
    }

    footer {
      text-align: center;
      padding: 22px;
      border-top: 2px solid var(--ink);
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      main { padding: 45px 0; }
      .order-card { padding: 18px; }
      .button { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="/">VODOU</a>
  </header>

  <main>
    <div class="symbol" id="symbol" aria-hidden="true">✓</div>
    <div class="eyebrow" id="eyebrow">Thank you</div>
    <h1 id="heading">Checking your order...</h1>
    <p id="message" role="status" aria-live="polite">
      We're securely verifying your payment. This should only take a moment.
    </p>

    <section class="order-card" id="orderCard" aria-label="Order summary">
      <h2>Order summary</h2>
      <div id="items"></div>
      <div class="item-row">
        <span id="shippingLabel">Shipping</span>
        <span id="shippingAmount">Included in total</span>
      </div>
      <div class="total-row">
        <span>Total paid</span>
        <span id="total"></span>
      </div>
      <div class="status-note" id="statusNote"></div>
    </section>

    <div class="actions">
      <a class="button" href="/merch.html">Back to Merch</a>
      <a class="button secondary" href="/">Visit Vodou</a>
    </div>

    <div class="actions" id="retryArea" style="display:none">
      <button class="button secondary" id="retryButton" type="button">
        Check Payment Again
      </button>
    </div>
  </main>

  <footer>© Vodou Official</footer>

  <script>
    (() => {
      "use strict";

      const API = "https://vodou-merch-api.kian-bowman25.workers.dev";
      const CART_KEY = "vodouMerchCartV1";

      const heading = document.getElementById("heading");
      const message = document.getElementById("message");
      const eyebrow = document.getElementById("eyebrow");
      const symbol = document.getElementById("symbol");
      const orderCard = document.getElementById("orderCard");
      const itemsContainer = document.getElementById("items");
      const totalElement = document.getElementById("total");
      const shippingLabel = document.getElementById("shippingLabel");
      const statusNote = document.getElementById("statusNote");
      const retryArea = document.getElementById("retryArea");
      const retryButton = document.getElementById("retryButton");

      let checking = false;

      // Keep the session ID available even after removing it from the URL.
      let checkoutSessionId = new URLSearchParams(
        window.location.search
      ).get("session_id");

      function showError(title, description) {
        heading.textContent = title;
        message.textContent = description;
        eyebrow.textContent = "Payment verification";
        symbol.textContent = "!";
        symbol.style.color = "#8b4b16";
        symbol.style.borderColor = "#8b4b16";
        retryArea.style.display = "flex";
      }

      function formatMoney(amount, currency) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: (currency || "usd").toUpperCase()
        }).format((Number(amount) || 0) / 100);
      }

      function displayOrder(data) {
        itemsContainer.replaceChildren();

        (Array.isArray(data.items) ? data.items : []).forEach(item => {
          const row = document.createElement("div");
          row.className = "item-row";

          const name = document.createElement("span");
          name.textContent = item.name || "Merchandise";

          const quantity = document.createElement("span");
          quantity.textContent = "Qty: " + (Number(item.quantity) || 1);

          row.append(name, quantity);
          itemsContainer.appendChild(row);
        });

        totalElement.textContent = formatMoney(
          data.amountTotal,
          data.currency
        );

        shippingLabel.textContent = data.shippingLabel || "Shipping";
        orderCard.style.display = "block";
      }

      function showFulfillmentStatus(status, testMode) {
        if (status === "dry_run" || testMode === true) {
          heading.textContent = "Test checkout verified!";
          message.textContent =
            "Your test payment was successfully verified. Thank you for helping us test the Vodou Official merch store.";
          statusNote.textContent =
            "TEST MODE: No Printify order was created. This was a test payment, not a real purchase.";
          return;
        }

        if (status === "draft_created" || status === "fulfilled") {
          heading.textContent = "Payment confirmed!";
          message.textContent =
            "Thank you for your order! Your payment was verified and your order has been created with our fulfillment provider.";

          statusNote.textContent =
            "ORDER CREATED: Your Printify order is currently a draft. We will review and manually approve it before it enters production. You do not need to do anything else right now.";
          return;
        }

        if (status === "pending") {
          heading.textContent = "Payment confirmed!";
          message.textContent =
            "Your payment was successful. We're waiting for the order-processing confirmation.";

          statusNote.textContent =
            "Your payment is verified, but the order-processing update has not arrived yet. Please check the order status again shortly.";
          retryArea.style.display = "flex";
          retryButton.textContent = "Check Order Status";
          return;
        }

        heading.textContent = "Payment verified!";
        message.textContent =
          "Your payment was successful. We're still confirming the order-processing status.";

        statusNote.textContent =
          "Your payment is verified. Order processing is still being checked. Please contact us if this message does not update.";
        retryArea.style.display = "flex";
        retryButton.textContent = "Check Order Status";
      }

      async function verifyPayment() {
        if (checking) return;

        checking = true;
        retryButton.disabled = true;
        retryButton.textContent = "Checking...";

        if (!checkoutSessionId ||
            !/^cs_(test|live)_[a-zA-Z0-9]+$/.test(checkoutSessionId)) {
          showError(
            "No verified checkout found",
            "We couldn't find a valid checkout session. Your cart has been left untouched. Return to the merch store if you still need to complete checkout."
          );

          checking = false;
          retryButton.disabled = false;
          retryButton.textContent = "Check Payment Again";
          return;
        }

        try {
          let data = null;

          // Allow time for the Stripe webhook to update order status.
          for (let attempt = 0; attempt < 10; attempt++) {
            const response = await fetch(
              API + "/checkout-session?session_id=" +
              encodeURIComponent(checkoutSessionId),
              {
                method: "GET",
                cache: "no-store"
              }
            );

            if (!response.ok) {
              throw new Error(
                "The payment verification service returned an error."
              );
            }

            data = await response.json();

            if (data.verified === true &&
                data.paid === true &&
                data.fulfillmentStatus &&
                data.fulfillmentStatus !== "pending") {
              break;
            }

            if (attempt < 9) {
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }

          if (!data || data.verified !== true || data.paid !== true) {
            showError(
              "Payment not yet verified",
              "We couldn't confirm a completed payment. Your cart has not been cleared. Please try checking again in a moment."
            );
            return;
          }

          // Clear the cart only after Stripe confirms a paid session.
          try {
            localStorage.removeItem(CART_KEY);
          } catch (storageError) {
            console.warn("Could not clear the saved cart.", storageError);
          }

          displayOrder(data);
          showFulfillmentStatus(
            data.fulfillmentStatus || "pending",
            data.testMode
          );

          // Hide the session ID from the address bar.
          // The ID remains in memory so the status button still works.
          window.history.replaceState(
            {},
            document.title,
            "/thank-you.html"
          );

        } catch (error) {
          console.error(error);

          showError(
            "We couldn't verify the payment",
            "There was a connection problem while checking your checkout. Your cart has been preserved unless payment was already verified. Please try again."
          );
        } finally {
          checking = false;
          retryButton.disabled = false;

          if (retryButton.textContent === "Checking...") {
            retryButton.textContent = "Check Payment Again";
          }
        }
      }

      retryButton.addEventListener("click", verifyPayment);
      verifyPayment();
    })();
  </script>
</body>
</html>
